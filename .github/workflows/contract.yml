name: device-link-contract

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install checker dependency
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Verify contract
        run: python -m tooling.check
      - name: Verify optimized contract
        run: python -O -m tooling.check --print-digest
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run optimized unit tests
        run: python -O -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q tooling tests
      - name: Check tracked whitespace
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD
      - name: Check generated changes
        run: git diff --exit-code
